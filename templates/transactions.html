<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Transactions Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="p-4">
    <div class="container">
      <h1 class="mb-3">Transactions Report</h1>
      <div class="mb-3">
        <strong>Period:</strong> {{ stats.date_min }} — {{ stats.date_max }}<br>
        <strong>Transactions:</strong> {{ stats.total_transactions }}<br>
        <strong>Net result:</strong>
        {% if stats.net_result is not none %}
          {{ "{:,.2f}".format(stats.net_result) }} PLN
        {% else %}
          N/A
        {% endif %}
      </div>

      <div class="row">
        {% for img in images %}
        <div class="col-md-6 mb-3">
          <div class="card">
            <img src="/{{ img }}" class="card-img-top" alt="plot">
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </body>
</html>
